[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "papiliovpn-core-api"
version = "0.0.0"
description = "The central management API for PapilioVPN"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore==3.10.0",
    "botocore==1.43.117",
    "faststream-outbox==0.21.0",
    "googleapis-common-protos==1.76.0",
    "papilio[server,postgresql,redis,auth,passwords,http,crypto] @ https://codeload.github.com/amupouya/papilio/tar.gz/984bc18d789fdae37e35cd015a54d38175155c62",
    "papilio-tasks[events-nats,outbox-postgres] @ https://codeload.github.com/amupouya/papilio-tasks/tar.gz/5b3861bc1b2b6794c1030534c9d7eb92572225d5",
    "papiliovpn-py-bridge[grpc-client] @ https://codeload.github.com/PapilioVPN/py-bridge/tar.gz/933edd7a12ac13991a2fab935d7c618d6a6abe13",
    "Pillow==13.0.0",
    "psutil==7.2.2",
]

[project.scripts]
papiliovpn-core = "src.entrypoints.cli:app"

[project.optional-dependencies]
tasks = [
    "papilio-tasks[scheduler-nats] @ https://codeload.github.com/amupouya/papilio-tasks/tar.gz/5b3861bc1b2b6794c1030534c9d7eb92572225d5",
]
dev = [
    "grpcio-tools==1.85.3",
    "types-aiobotocore[s3]==3.10.0",
    "papilio[test]",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "trustme==1.2.1",
    "types-grpcio==1.85.0.20261028",
    "types-protobuf==7.35.1.20260906",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "scripts/seeders", "alembic.ini", "README.md", "config.yml.sample", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: controlled, in-process checks",
    "integration: checks using native runtime dependencies",
    "api: HTTP API checks",
]

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = [
    "src/apps/network/*/*/infra/grpc/v1/*_pb2*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["src", "tests"]
ignore = [
    "src/apps/network/*/*/infra/grpc/v1/*_pb2_grpc.py",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportUntypedFunctionDecorator = "error"
venvPath = "."
venv = ".venv"
